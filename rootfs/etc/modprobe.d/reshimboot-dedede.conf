# audio on dedede uses the SOF driver with firmware signed with the community key.
# the 5.4 shim kernel does not find it automatically (newer kernels do), so the
# firmware path has to be set. without this there is no sound card at all.
options snd-sof-pci fw_path=intel/sof/community

# keep the legacy drivers from grabbing the audio DSP before SOF does
blacklist snd_hda_intel
blacklist snd_soc_skl
