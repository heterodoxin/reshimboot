# NetworkManager defaults for the older wifi drivers in the dedede shim kernel

[device]
# randomized MAC addresses during scans cause failed scans on some drivers
wifi.scan-rand-mac-address=no

[connection]
# wifi power saving causes dropped connections and high latency
wifi.powersave=2
# Mixed WPA2/WPA3 networks get stuck asking for the password over and over.
# Disabling protected management frames makes NetworkManager use WPA2 on them.
# Networks that only allow WPA3 need "sudo nmcli connection modify <name> wifi-sec.pmf required".
wifi-sec.pmf=1
