# Audio fixes for the SOF sound card on dedede (WirePlumber 0.5 and newer).
# More headroom fixes crackling, and not suspending the output stops the
# speaker amps from cutting off the start of every sound.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "~sof-*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 2048
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
