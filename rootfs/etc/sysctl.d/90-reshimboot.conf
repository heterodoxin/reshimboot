# reshimboot tweaks for the dedede shim kernel

# Chrome OS kernels panic when a task hangs, which reboots the Chromebook to the
# recovery or "tonorm" screen. Slow USB drives can stall writes long enough to
# trigger this, so make hung tasks and soft lockups non-fatal.
-kernel.hung_task_panic = 0
-kernel.softlockup_panic = 0

# Limit how much unwritten data can pile up in RAM. With the defaults, large
# writes to a USB drive or SD card build up gigabytes of dirty pages and then
# freeze the whole system while they are flushed.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864

# swap is zram only, which is much faster than a disk
vm.swappiness = 100
vm.page-cluster = 0

# enough inotify watches for IDEs, file managers, and sync clients
fs.inotify.max_user_watches = 524288
