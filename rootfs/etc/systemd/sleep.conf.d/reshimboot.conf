# Suspend and hibernation are disabled in the shim kernel. Trying to suspend
# (for example after the laptop is idle for a while) can crash or reboot the
# Chromebook, so tell the desktop that sleeping is not possible at all.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
