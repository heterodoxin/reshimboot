# mke2fs configuration used for every filesystem in the reshimboot image.
#
# The dedede shim runs Linux 5.4, but the machine that builds the image can
# have a much newer e2fsprogs. Debian 13, Arch, and Fedora enable features
# like orphan_file by default, which Linux 5.4 does not understand. A 5.4
# kernel will only mount such a filesystem read-only, so the image would not
# boot. This file pins the feature set to one that Linux 5.4 fully supports,
# no matter where the image is built. It is used via MKE2FS_CONFIG.

[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext3 = {
		features = has_journal
	}
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
	}
	small = {
		inode_ratio = 4096
	}
	floppy = {
		inode_ratio = 8192
	}
