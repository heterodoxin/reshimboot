# This is a stub that reshimboot bind-mounts over /etc/init/update-engine.conf
# when booting Chrome OS with the verified-mode spoof.
#
# The real job starts update_engine "on starting system-services", so it runs
# on every boot. When Chrome OS is booted through shimboot on an enrolled
# device, that update check gates OOBE behind a forced "update required"
# screen, and, worse, if the update ever finishes the newer Chrome OS boots
# normally (not through shimboot) and re-locks/re-enrolls the device, undoing
# the spoof.
#
# This stub has no "start on" line, so upstart never starts update_engine.
# Nothing is written to the internal drive; the real config is untouched and
# updates work again as soon as you boot Chrome OS without shimboot.

description     "System software update service (disabled by reshimboot)"
author          "reshimboot"

# intentionally never started
