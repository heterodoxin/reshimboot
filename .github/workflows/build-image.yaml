name: build-image
run-name: Build the reshimboot disk image for dedede
on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Debian release"
        default: "trixie"
        type: choice
        options: [trixie, bookworm, forky]
      desktop:
        description: "Desktop environment"
        default: "xfce"
        type: choice
        options: [xfce, gnome, kde, lxde, cinnamon, mate, lxqt]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: download repo
        uses: actions/checkout@v4

      - name: run build
        run: |
          sudo apt-get update
          sudo DEBUG=1 ./build_complete.sh \
            compress_img=1 quiet=1 \
            release=${{ github.event.inputs.release || 'trixie' }} \
            desktop=${{ github.event.inputs.desktop || 'xfce' }}

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_dedede
          path: data/shimboot_dedede.bin
          compression-level: 6

      - name: create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/shimboot_dedede.zip

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: download repo
        uses: actions/checkout@v4

      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3

      - name: shellcheck
        run: ./tools/lint.sh

      - name: python syntax
        run: python3 -m py_compile tools/shimtool.py
