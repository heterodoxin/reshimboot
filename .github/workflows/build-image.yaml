name: build-image
run-name: Build reshimboot for dedede

on:
  push:
    #a full image build takes a while, so skip it for documentation changes
    paths-ignore:
      - '**.md'
      - 'website/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      release:
        description: "Debian release"
        default: "trixie"
        type: choice
        options: [trixie, forky, bookworm, sid]
      desktop:
        description: "Desktop environment"
        default: "kde"
        type: choice
        options: [kde, xfce, gnome, lxqt, mate, cinnamon, lxde, none]

#a newer push makes the build of an older commit pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: download repo
        uses: actions/checkout@v4

      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3 cpio

      - name: lint and unit tests
        run: ./tools/lint.sh

  build:
    needs: lint
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        #tagged releases get an image for each of the main desktops,
        #everything else builds only the requested (or default) one
        desktop: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["kde", "xfce", "gnome"]' || format('["{0}"]', github.event.inputs.desktop || 'kde')) }}
    steps:
      #pinned fork, see easimon/maximize-build-space#58 (same fix as upstream shimboot)
      - name: maximize build space
        uses: smallprogram/maximize-build-space@16007771e4642069097fc3e7444638474e5db178
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      #snapd randomly kills the runner during the build (same fix as upstream shimboot)
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: download repo
        uses: actions/checkout@v4

      #the patched systemd for forky and sid is compiled during the build,
      #which takes a while. build_systemd.sh reuses it until debian updates systemd.
      - name: restore the patched systemd
        uses: actions/cache@v4
        with:
          path: data/systemd
          key: systemd-${{ github.event.inputs.release || 'trixie' }}-${{ github.run_id }}
          restore-keys: systemd-${{ github.event.inputs.release || 'trixie' }}-

      #/ only has 4GB left after the step above, so keep temporary files in the workspace
      - name: run build
        env:
          TMPDIR: ${{ github.workspace }}/data/tmp
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo --preserve-env=TMPDIR DEBUG=1 ./build_complete.sh \
            compress_img=xz quiet=1 cache=0 \
            release=${{ github.event.inputs.release || 'trixie' }} \
            desktop=${{ matrix.desktop }}

      - name: name the image after the desktop
        run: |
          cd data
          sudo mv shimboot_dedede.bin.xz reshimboot_dedede_${{ matrix.desktop }}.bin.xz
          sudo sh -c 'sha256sum reshimboot_dedede_${{ matrix.desktop }}.bin.xz > reshimboot_dedede_${{ matrix.desktop }}.bin.xz.sha256'

      - name: upload image
        uses: actions/upload-artifact@v4
        with:
          name: reshimboot_dedede_${{ matrix.desktop }}
          path: |
            data/reshimboot_dedede_${{ matrix.desktop }}.bin.xz
            data/reshimboot_dedede_${{ matrix.desktop }}.bin.xz.sha256
          compression-level: 0

      - name: create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            data/reshimboot_dedede_${{ matrix.desktop }}.bin.xz
            data/reshimboot_dedede_${{ matrix.desktop }}.bin.xz.sha256
